services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ai_careerguide_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_careerguide}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_careerguide}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ai_careerguide_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ai_careerguide_backend:latest
    container_name: ai_careerguide_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ai_careerguide}
      - SECRET_KEY=${SECRET_KEY:-ai_careerguide_super_secret_jwt_key_2026_owasp_compliant}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.xkiro.com/v1}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - XAI_BASE_URL=${XAI_BASE_URL:-https://api.xkiro.com/v1}
      - LLM_MODEL=${LLM_MODEL:-mistralai/mistral-large-2512}
      - VISION_LLM_MODEL=${VISION_LLM_MODEL:-mistralai/mistral-large-2512}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - ENVIRONMENT=development
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "python scripts/init_db.py &&
             python scripts/seed_tt09.py &&
             python app/db/seeds/seed_assessment_questions.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - ai_careerguide_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ai_careerguide_frontend:latest
    container_name: ai_careerguide_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
      - "3000:80"
    networks:
      - ai_careerguide_net

volumes:
  postgres_data:
    driver: local

networks:
  ai_careerguide_net:
    driver: bridge
