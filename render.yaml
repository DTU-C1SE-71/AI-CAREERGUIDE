services:
  - type: web
    name: ai-careerguide-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: singapore
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_BASE_URL
        value: https://api.xkiro.com/v1
      - key: LLM_MODEL
        value: mistralai/mistral-medium-3.5
      - key: LLM_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://ai-careerguide-ten.vercel.app
      - key: DATABASE_URL
        sync: false
